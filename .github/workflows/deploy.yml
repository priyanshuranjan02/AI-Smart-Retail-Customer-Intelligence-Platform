name: CI/CD Pipeline - Smart Retail AI Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Haar Cascade & Train Models
        run: |
          curl -sSL -o data/haarcascade_frontalface_default.xml https://raw.githubusercontent.com/opencv/opencv/master/data/haarcascade_frontalface_default.xml
          python scripts/train_all_models.py
          python scripts/seed_database.py

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest -v

      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Build React Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Docker Image
        run: |
          docker build -t smart-retail-ai:latest .
